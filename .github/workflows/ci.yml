name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -r requirements.txt
      - name: Run tests
        run: .venv\Scripts\python -m pytest tests